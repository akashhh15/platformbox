---
directory:
  - .
quiet: true
compact: true
framework:
  - terraform
  - kubernetes
  - dockerfile
  - github_actions
skip-path:
  - .git
  - .venv
  - tools
  - node_modules
  # Kyverno policy test data. These pods deliberately model edge cases (missing
  # labels, probes, limits, etc.), so production hardening checks do not apply.
  # checkov matches skip-path by directory name, so use the bare name.
  - fixtures
  # Phase 6 policy unit-test fixtures use the same deliberately bad pods, plus
  # a kube-system and an app-data pod that are outside the hardened namespaces.
  - tests
