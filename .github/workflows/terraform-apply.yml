---
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform-apply.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

jobs:
  apply-dev:
    name: apply dev behind required reviewers
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: gha-apply-dev

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo '::error::TF_STATE_BUCKET repository variable is required for apply jobs.'
            exit 1
          fi
          cd infra/environments/dev
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false -auto-approve
