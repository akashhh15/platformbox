---
name: terraform-ci

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform-ci.yml

permissions: {}

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: fmt, validate, tflint, checkov and trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python tooling
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.66.0

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Terraform init and validate
        run: |
          set -euo pipefail
          dirs=$(find infra -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          while IFS= read -r dir; do
            echo "==> $dir"
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color)
          done <<< "$dirs"

      - name: TFLint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Checkov
        run: checkov -d infra --framework terraform --quiet --compact

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: infra
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

  plan:
    name: plan dev
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: gha-plan-dev-${{ github.event.pull_request.number }}

      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo '::error::TF_STATE_BUCKET repository variable is required for plan jobs.'
            exit 1
          fi
          cd infra/environments/dev
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}" \
            -backend-config="use_lockfile=true"
          set +e
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -gt 2 ]; then
            echo "::error::terraform plan failed with exit code $code"
            exit "$code"
          fi
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed with exit code 1"
            exit 1
          fi
          terraform show -no-color tfplan > plan-summary.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload plan summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terraform-plan-dev
          path: |
            infra/environments/dev/plan.txt
            infra/environments/dev/plan-summary.txt
          retention-days: 7

      - name: Comment plan summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/environments/dev/plan-summary.txt';
            const plan = fs.readFileSync(path, 'utf8');
            const marker = '<!-- terraform-plan-dev -->';
            const body = [
              marker,
              '### Terraform plan: dev',
              '',
              `Plan exit code: ${process.env.PLAN_EXIT_CODE} (2 means changes are proposed).`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan.slice(0, 60000),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  infracost:
    name: cost estimate
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: Check Infracost configuration
        id: infracost-config
        shell: bash
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "INFRACOST_API_KEY is not set; skipping cost estimate."
          fi
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: head
          persist-credentials: false

      - name: Post Infracost diff
        if: steps.infracost-config.outputs.configured == 'true'
        uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base/infra/environments/dev
          head-path: head/infra/environments/dev
          version: sha256:e7ddb5c9026624456b47ec4208da00ef942ee390b29cb331d648b8c0d8731ee5
          github-token: ${{ github.token }}
