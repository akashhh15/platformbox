---
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: enforce conventional commit title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const types = 'feat|fix|docs|ci|chore|refactor|perf|test|build|style|revert';
            const pattern = new RegExp(`^(${types})(\\([a-z0-9._/-]+\\))?!?: .{3,}$`);
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title ${JSON.stringify(title)} is not a Conventional Commit. ` +
                'Use: type(scope): short description'
              );
            } else {
              core.info(`Valid PR title: ${title}`);
            }
