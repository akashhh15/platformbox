---
name: gitops-validate

on:
  pull_request:
    paths:
      - gitops/**
      - scripts/gitops-validate.sh
      - scripts/observability-validate.sh
      - scripts/progressive-validate.sh
      - scripts/resilience-validate.sh
      - scripts/demo-canary-good.sh
      - scripts/demo-canary-bad.sh
      - scripts/helm-lint.sh
      - chaos/**
      - loadtest/**
      - docs/demo.md
      - docs/resilience.md
      - docs/runbooks/**
      - .yamllint.yaml
      - .github/workflows/gitops-validate.yml
  push:
    branches: [main]
    paths:
      - gitops/**
      - scripts/gitops-validate.sh
      - scripts/observability-validate.sh
      - scripts/progressive-validate.sh
      - scripts/resilience-validate.sh
      - scripts/demo-canary-good.sh
      - scripts/demo-canary-bad.sh
      - scripts/helm-lint.sh
      - chaos/**
      - loadtest/**
      - docs/demo.md
      - docs/resilience.md
      - docs/runbooks/**
      - .yamllint.yaml
      - .github/workflows/gitops-validate.yml

permissions: {}

concurrency:
  group: gitops-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: render and validate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python tooling
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install Kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kustomize.tar.gz \
            'https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz'
          checksum='cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61'
          echo "$checksum  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            'https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz'
          checksum='9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883'
          echo "$checksum  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Install Kyverno CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kyverno.tar.gz \
            'https://github.com/kyverno/kyverno/releases/download/v1.20.0/kyverno-cli_v1.20.0_linux_x86_64.tar.gz'
          checksum='06b8f3ca7b5626473be8fb4d343ad54ab84e317142766f72420e7d44b80942e2'
          echo "$checksum  /tmp/kyverno.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kyverno.tar.gz -C /usr/local/bin kyverno
          kyverno version

      - name: Install promtool
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/prometheus.tar.gz \
            'https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz'
          checksum='68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34'
          echo "$checksum  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /usr/local/bin \
            --strip-components=1 prometheus-3.16.0.linux-amd64/promtool
          promtool --version

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k6.tar.gz \
            'https://github.com/grafana/k6/releases/download/v2.4.0/k6-v2.4.0-linux-amd64.tar.gz'
          checksum='5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87'
          echo "$checksum  /tmp/k6.tar.gz" | sha256sum -c -
          tar -xzf /tmp/k6.tar.gz -C /usr/local/bin \
            --strip-components=1 k6-v2.4.0-linux-amd64/k6
          k6 version

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        with:
          version: v4.3.2

      - name: Render and validate overlays
        run: bash scripts/gitops-validate.sh

      - name: Validate Prometheus rules and dashboards
        run: bash scripts/observability-validate.sh

      - name: Validate resilience profiles and experiments
        run: bash scripts/resilience-validate.sh

      - name: Run Kyverno policy unit tests
        run: bash scripts/policy-test.sh

      - name: Lint pinned Helm charts
        run: bash scripts/helm-lint.sh
