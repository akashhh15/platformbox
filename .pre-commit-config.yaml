---
minimum_pre_commit_version: "4.7.0"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/.*\.py$
      - id: ruff-format
        files: ^apps/.*\.py$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
        files: ^infra/.*\.(tf|tfvars)$
      - id: terraform_validate
        files: ^infra/.*\.(tf|tfvars)$
        args: [--tf-init-args=-backend=false]
      - id: terraform_docs
        files: ^infra/.*\.tf$
        args: [--args=--lockfile=false]
      - id: terraform_tflint
        files: ^infra/.*\.(tf|tfvars)$
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]

  - repo: local
    hooks:
      - id: checkov
        name: checkov
        entry: bash scripts/checkov.sh --config-file .checkov.yaml
        language: system
        files: ^(infra|gitops|apps)/.*(\.(tf|ya?ml|json)|/Dockerfile)$
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: (^|/)Dockerfile$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
