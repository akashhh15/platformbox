---
extends: default

rules:
  line-length:
    max: 120
    level: error
  truthy:
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable

ignore: |
  .venv/
  tools/
  node_modules/
  .git/
  # Helm templates are Go templates, not standalone YAML documents.
  gitops/platform/karpenter-chart/templates/
