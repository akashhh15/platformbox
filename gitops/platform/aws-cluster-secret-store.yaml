# AWS-only External Secrets store used by gitops/apps/overlays/*.
#
# The ESO chart creates the `external-secrets` ServiceAccount in the
# `external-secrets` namespace. Before this store can read secrets, annotate
# that ServiceAccount with the IRSA role ARN output by the Terraform dev/prod
# environment:
#
#   kubectl annotate serviceaccount external-secrets \
#     -n external-secrets \
#     eks.amazonaws.com/role-arn=<terraform_output_role_arn> \
#     --overwrite
#
# No role ARN or secret value is stored in Git. See docs/SETUP.md and ADR-004.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: platformbox
spec:
  provider:
    aws:
      service: SecretsManager
      # Matches the default region in the Terraform variables. Change this
      # manifest when the AWS path is deployed to a different region.
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
