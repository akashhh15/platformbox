# AWS-only platform resource. The cluster generator matches only registered
# clusters labelled `platformbox.io/target: eks`, so kind never receives a
# ClusterSecretStore with an invalid IRSA configuration. See ADR-019.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-secrets-store
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            platformbox.io/target: eks
  template:
    metadata:
      name: '{{.nameNormalized}}-aws-secrets-store'
      namespace: argocd
    spec:
      project: platform
      source:
        repoURL: https://github.com/akashhh15/platformbox.git
        targetRevision: main
        path: gitops/platform/aws-secrets-store
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ClientSideApplyMigration=false
