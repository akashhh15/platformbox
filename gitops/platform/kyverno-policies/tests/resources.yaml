apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: app-dev
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/version: "0.1.0"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: ghcr.io/akashhh15/platformbox/api:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-hardening-pod
  namespace: app-dev
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/version: "0.1.0"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  containers:
    - name: api
      image: ghcr.io/akashhh15/platformbox/api:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        capabilities:
          drop:
            - NET_RAW
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-host-pod
  namespace: app-dev
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/version: "0.1.0"
spec:
  automountServiceAccountToken: false
  hostNetwork: true
  hostPID: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: host
      hostPath:
        path: /var/run/docker.sock
  containers:
    - name: api
      image: ghcr.io/akashhh15/platformbox/api:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        privileged: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
      volumeMounts:
        - name: host
          mountPath: /var/run/docker.sock
---
apiVersion: v1
kind: Pod
metadata:
  name: platform-pod
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: agent
      image: example.com/agent:latest
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: data-pod
  namespace: app-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/version: "16.4"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
  containers:
    - name: postgres
      image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 250m
          memory: 192Mi
      livenessProbe:
        exec:
          command:
            - pg_isready
      readinessProbe:
        exec:
          command:
            - pg_isready
