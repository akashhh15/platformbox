apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-standard-labels
  annotations:
    policies.kyverno.io/title: Require standard labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: app-namespace
      expression: "object.metadata.?namespace.orValue('').startsWith('app-')"
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        'app.kubernetes.io/instance' in object.metadata.labels &&
        'app.kubernetes.io/version' in object.metadata.labels
      message: "Pods must carry the standard app.kubernetes.io/* labels."
