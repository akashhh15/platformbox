apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: app-namespace
      expression: "object.metadata.?namespace.orValue('').startsWith('app-')"
  validations:
    - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
      message: "Images must not use the 'latest' tag."
    - expression: "(object.spec.?initContainers.orValue([])).all(c, !c.image.endsWith(':latest'))"
      message: "Init container images must not use the 'latest' tag."
