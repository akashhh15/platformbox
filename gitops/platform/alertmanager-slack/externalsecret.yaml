# The Slack webhook is supplied by the human in AWS Secrets Manager. Nothing in
# Git contains a webhook URL. The cluster secret store is installed by the
# EKS-gated ApplicationSet in gitops/platform/aws-secrets-store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: platformbox/alertmanager
        property: webhook_url
