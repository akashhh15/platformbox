apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno
    targetRevision: 3.10.0
    helm:
      values: |
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
        upgrade:
          # Fresh cluster with only CEL policies; the server-side hook pulls an
          # extra image and blocks the sync on slow networks.
          legacyPolicyCheck:
            enabled: false
        migration:
          # On a fresh cluster there are no old CRD versions to migrate. This
          # post-upgrade hook pulls kyverno-cli and stalls slow local networks.
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
