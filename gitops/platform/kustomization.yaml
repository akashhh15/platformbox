apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ingress-nginx.yaml
  - external-secrets.yaml
  - aws-cluster-secret-store.yaml
  - kyverno.yaml
  - kyverno-policies-app.yaml
  - monitoring.yaml
  - logging.yaml
  - argo-rollouts.yaml
  - apps-applicationset.yaml

# Helm charts in this platform ship CRDs larger than the 262144-byte
# Kubernetes annotation limit. Client-side apply stores the whole manifest in
# kubectl.kubernetes.io/last-applied-configuration and fails on those CRDs.
# Server-side apply uses managedFields instead, so every Application needs it.
# Argo CD 3.5+ also tries a client-side migration patch before the apply; that
# regression hits the same limit, so migration is disabled until it is fixed.
# See docs/adr/ADR-011-argocd-server-side-apply.md.
patches:
  - target:
      kind: Application
    patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: platform-sync-options
      spec:
        syncPolicy:
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
            - ClientSideApplyMigration=false
