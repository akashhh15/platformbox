apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.11.3
    helm:
      values: |
        # kind maps host ports 80/443 to the control-plane node. Running the
        # controller with hostNetwork binds those ports directly on that node.
        controller:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          ingressClassResource:
            name: nginx
            default: true
          service:
            type: NodePort
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Equal
              effect: NoSchedule
          admissionWebhooks:
            # Disabled locally only: avoids webhook certificate bootstrap
            # races on a freshly created kind cluster.
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
