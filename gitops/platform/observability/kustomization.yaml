apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-rules.yaml
  - platform-servicemonitors.yaml

# Grafana's sidecar imports ConfigMaps carrying grafana_dashboard: "1".
# disableNameSuffixHash keeps the ConfigMap name stable across edits so an
# obsolete dashboard is pruned rather than left behind.
configMapGenerator:
  - name: dashboard-cluster-overview
    namespace: monitoring
    files:
      - dashboards/cluster-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-nodes-karpenter
    namespace: monitoring
    files:
      - dashboards/nodes-karpenter.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-argocd
    namespace: monitoring
    files:
      - dashboards/argocd.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-api-red
    namespace: monitoring
    files:
      - dashboards/api-red.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-worker
    namespace: monitoring
    files:
      - dashboards/worker.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-kyverno
    namespace: monitoring
    files:
      - dashboards/kyverno.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
  - name: dashboard-cost-by-namespace
    namespace: monitoring
    files:
      - dashboards/cost-by-namespace.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: platformbox
