apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base

namespace: app-dev

# CI writes the immutable image tag/digest into these three entries.
# See ADR-014 for the exact machine-editable format.
images:
  - name: ghcr.io/akashhh15/platformbox/api
    newTag: dev
  - name: ghcr.io/akashhh15/platformbox/worker
    newTag: dev
  - name: ghcr.io/akashhh15/platformbox/frontend
    newTag: dev

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: api
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames/0
        value: app-dev
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: worker
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames/0
        value: app-dev
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: dev
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: dev
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 48Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 125m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 96Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 15m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 24Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 48Mi
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
