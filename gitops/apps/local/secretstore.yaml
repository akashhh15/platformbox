# Local-only External Secrets provider. The values are the same non-sensitive
# defaults used by apps/docker-compose.yml; they are not real credentials.
# See ADR-004 and ADR-016.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: local-fake
  labels:
    app.kubernetes.io/part-of: platformbox
spec:
  provider:
    fake:
      data:
        - key: platformbox/database
          value: '{"username":"app","password":"app","host":"postgres","port":"5432","name":"app"}'
        - key: platformbox/redis
          value: '{"redis_url":"redis://redis:6379/0"}'
