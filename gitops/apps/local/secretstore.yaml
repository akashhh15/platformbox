# Local-only External Secrets provider. Credentials match the non-sensitive
# defaults in apps/docker-compose.yml; hosts are in-cluster FQDNs because the
# data services live in the app-data namespace. They are not real credentials.
# See ADR-004 and ADR-016.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: local-fake
  labels:
    app.kubernetes.io/part-of: platformbox
spec:
  provider:
    fake:
      data:
        - key: platformbox/database
          value: >-
            {
              "username": "app",
              "password": "app",
              "host": "postgres.app-data.svc.cluster.local",
              "port": "5432",
              "name": "app"
            }
        - key: platformbox/redis
          value: '{"redis_url":"redis://redis.app-data.svc.cluster.local:6379/0"}'
