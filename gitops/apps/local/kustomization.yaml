apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind smoke test only. Not generated by the ApplicationSet.
# Data services live in gitops/apps/local-data and use the same `app-data`
# namespace referenced by the base NetworkPolicies.
resources:
  - namespace.yaml
  - secretstore.yaml
  - ../base

namespace: app-local

# Locally built images are loaded into kind by scripts/local-smoke.sh.
images:
  - name: ghcr.io/akashhh15/platformbox/api
    newName: platformbox-api
    newTag: local
  - name: ghcr.io/akashhh15/platformbox/worker
    newName: platformbox-worker
    newTag: local
  - name: ghcr.io/akashhh15/platformbox/frontend
    newName: platformbox-frontend
    newTag: local

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: api
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames/0
        value: app-local
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: worker
    patch: |-
      - op: replace
        path: /spec/namespaceSelector/matchNames/0
        value: app-local
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: api
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: frontend
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: local
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "true"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: local
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: frontend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: api-credentials
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: local-fake
      - op: replace
        path: /spec/secretStoreRef/kind
        value: SecretStore
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: worker-credentials
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: local-fake
      - op: replace
        path: /spec/secretStoreRef/kind
        value: SecretStore
