apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-credentials
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: platformbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: api-credentials
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql+psycopg://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .name }}"
        REDIS_URL: "{{ .redis_url }}"
  dataFrom:
    - extract:
        key: platformbox/database
    - extract:
        key: platformbox/redis
