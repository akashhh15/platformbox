apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: platformbox
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: platformbox
    # kube-prometheus-stack's default serviceMonitorSelector is release=monitoring.
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  namespaceSelector:
    matchNames:
      - app-dev
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
