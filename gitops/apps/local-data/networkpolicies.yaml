# Data services accept traffic only from app namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-namespaces
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: platformbox.io/environment
                operator: In
                values:
                  - local
                  - dev
                  - staging
                  - prod
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
