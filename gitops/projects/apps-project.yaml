apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Application workloads (api, worker, frontend).
  sourceRepos:
    - https://github.com/akashhh15/platformbox.git
  destinations:
    - namespace: "app-*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
