apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Application workloads (api, worker, frontend).
  sourceRepos:
    - https://github.com/akashhh15/platformbox.git
  destinations:
    # ApplicationSets generate apps for whichever EKS cluster carries the
    # platformbox.io/target=eks label, so the server is dynamic. Namespace and
    # source repository remain constrained. See ADR-015.
    - namespace: "app-*"
      server: "*"
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
