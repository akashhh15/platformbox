# Root Argo CD application (app of apps).
# Applied once by `make local-up`. Everything after this point is managed by
# Argo CD through Git. The repo URL is the public GitHub mirror so the cluster
# can fetch manifests without local git access.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/akashhh15/platformbox.git
    targetRevision: main
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
