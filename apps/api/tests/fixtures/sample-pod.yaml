apiVersion: v1
kind: Pod
metadata:
  name: sample
  namespace: app-dev
  labels:
    app.kubernetes.io/name: sample
    app.kubernetes.io/instance: sample
    app.kubernetes.io/version: "1.0.0"
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: platformbox-api:1.0.0
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
      readinessProbe:
        httpGet:
          path: /ready
          port: 8000
      securityContext:
        allowPrivilegeEscalation: false
